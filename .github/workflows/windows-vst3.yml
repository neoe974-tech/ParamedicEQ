name: Build Paramedic EQ - Windows VST3

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-vst3:
    name: Windows VST3 Build
    # Pin the runner to the image that includes Visual Studio 2022.
    # windows-latest can move to a newer Windows image where the
    # Visual Studio 17 2022 generator is not available.
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Visual Studio 2022
        shell: pwsh
        run: |
          Write-Host "Visual Studio installations:"
          & "${env:ProgramFiles}\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest `
            -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Visual Studio 2022 C++ tools were not found."
            exit 1
          }

      - name: Configure CMake
        run: cmake -S ParamedicEQ-v2 -B build -G "Visual Studio 17 2022" -A x64

      - name: Build Release
        run: cmake --build build --config Release --parallel

      - name: Locate VST3
        shell: pwsh
        run: |
          $vst3 = Get-ChildItem -Path "$env:GITHUB_WORKSPACE/build" -Recurse -Directory -Filter "Paramedic EQ.vst3" | Select-Object -First 1
          if (-not $vst3) {
            Write-Host "VST3 output was not found. Build tree:"
            Get-ChildItem "$env:GITHUB_WORKSPACE/build" -Recurse | Select-Object FullName
            exit 1
          }
          "VST3_PATH=$($vst3.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Found: $($vst3.FullName)"

      - name: Package VST3
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "$env:VST3_PATH" -DestinationPath "dist/Paramedic-EQ-v2.0.5-Windows-VST3.zip" -Force

      - name: Upload VST3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: Paramedic-EQ-v2.0.5-Windows-VST3
          path: dist/Paramedic-EQ-v2.0.5-Windows-VST3.zip
          if-no-files-found: error
